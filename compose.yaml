name: billiards-practices
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: micro_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-micro_admin_dev}
      POSTGRES_DB: postgres
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U micro_admin -d postgres
      interval: 5s
      timeout: 5s
      retries: 15
  rabbitmq:
    image: docker.io/library/rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-micro}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-micro}
    ports:
    - 127.0.0.1:5672:5672
    - 127.0.0.1:15672:15672
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    - ./infra/rabbitmq.conf:/etc/rabbitmq/conf.d/20-practice5.conf:ro
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 5s
      retries: 20
  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://users:users_dev@postgres:5432/users
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-micro}:${RABBITMQ_PASSWORD:-micro}@rabbitmq:5672/
      PROVIDER_TOKEN: ${PROVIDER_TOKEN:-demo-provider-token}
    ports:
    - 127.0.0.1:8001:8000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  catalog:
